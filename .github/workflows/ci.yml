name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Both the minimum Go version go.mod claims and the current toolchain,
      # so the two never silently diverge. Literal versions, not
      # go-version-file, precisely so this matrix does not collapse to one
      # entry; update by hand when go.mod's `go` directive changes.
      matrix:
        go-version: ["1.25.0", "1.26.0"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        run: make lint

  native-core:
    # The host-neutral core carries no FPP headers and no third-party
    # libraries, so it builds anywhere a C++17 compiler does. Both
    # compilers run because the FPP fleet spans distributions with
    # different defaults, and a warning that is an error on one of them is
    # the cheapest place to find that out.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v5

      - name: Install clang
        if: matrix.compiler == 'clang++'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang

      # ubuntu-latest carries only C.UTF-8 by default, the same gap as
      # debian:trixie, and a skipped locale test reads as a pass. Generate
      # one and demand it here, so CLocaleGuard's coverage cannot go quiet.
      # localedef, not locale-gen: a minimal image's /etc/locale.gen has no
      # de_DE entry to uncomment, so locale-gen silently generates nothing.
      - name: Generate a comma-decimal locale
        run: |
          sudo localedef -i de_DE -f UTF-8 de_DE.UTF-8
          locale -a | grep -i de_DE

      - name: Assert the core reaches for no FPP header
        run: make -C native check-host-neutral

      - name: Build and test
        env:
          SHOWMESH_REQUIRE_LOCALE_TEST: "1"
        run: make -C native test CXX=${{ matrix.compiler }}

      # A diagnostic, not a pass/fail gate (it prints a disagreement rate,
      # it does not assert one), so this only proves the build itself has
      # not bit-rotted against BrightnessEngine's current adoptState
      # signature, which is exactly what let it go uncompiled for a whole
      # signature change last time.
      - name: Build and run the MultiSync convergence harness
        run: make -C native convergence-harness CXX=${{ matrix.compiler }}

      - name: Build and test under the address and undefined-behavior sanitizers
        env:
          SHOWMESH_REQUIRE_LOCALE_TEST: "1"
        run: |
          make -C native clean
          make -C native test CXX=${{ matrix.compiler }} \
            CXXFLAGS="-std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer"

      # The callback handoff is the one place two threads meet, so the
      # thread sanitizer is the check that actually constrains it.
      - name: Build and test under the thread sanitizer
        env:
          SHOWMESH_REQUIRE_LOCALE_TEST: "1"
        run: |
          make -C native clean
          make -C native test CXX=${{ matrix.compiler }} \
            CXXFLAGS="-std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=thread"

  fpp-adapters:
    # Each adapter is compiled against the FPP major it is for, at a pinned
    # tag and commit recorded in native/adapters/FPP-PINS.md. FPP 10
    # versions and checks its plugin ABI at dlopen, so the two adapters are
    # separate binaries and are built separately here.
    #
    # This proves the adapters agree with those headers and export what the
    # loader looks up. It is not evidence that the plugin loads into a
    # running fppd or behaves correctly on hardware.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: fpp9
            ref: "9.5.3"
            commit: 7979a4bb0bb9068fea71f3b447e273d5c0ea01e3
          - major: fpp10
            ref: "10.0-beta5"
            commit: 741cfc4344bd0d1b913941d507c3a123a8c82e5a
    steps:
      - name: Install the toolchain
        run: |
          set -eux
          apt-get update -o Acquire::Retries=2
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            g++ make pkg-config binutils git ca-certificates gawk libjsoncpp-dev

      # FPP 9 headers reach for libhttpserver, which Debian does not
      # package. FPP installs 0.19.0 from source and so does this job, so
      # the HTTP_RESPONSE_CONST decision fpp-pch.h makes from the installed
      # version matches what a real host would decide.
      - name: Install libhttpserver 0.19.0
        if: matrix.major == 'fpp9'
        run: |
          set -eux
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libmicrohttpd-dev autoconf automake libtool
          git clone --depth 1 --branch 0.19.0 https://github.com/etr/libhttpserver /tmp/libhttpserver
          actual=$(git -C /tmp/libhttpserver rev-parse HEAD)
          echo "libhttpserver 0.19.0 is at $actual"
          # The tag is a moving name; the commit is the pin, recorded in
          # FPP-PINS.md alongside the FPP pins because HTTP_RESPONSE_CONST
          # derives from this installed version.
          test "$actual" = "60be2d347fb3c757b2e77efc997120e47ed8fb7f"
          cd /tmp/libhttpserver
          ./bootstrap
          mkdir build && cd build
          ../configure --prefix=/usr --disable-examples
          make -j"$(nproc)"
          make install

      - uses: actions/checkout@v5

      - name: Check out FPP at the pinned tag
        run: |
          set -eux
          git config --global --add safe.directory '*'
          git clone --depth 1 --branch "${{ matrix.ref }}" https://github.com/FalconChristmas/fpp.git /tmp/fpp
          actual=$(git -C /tmp/fpp rev-parse HEAD)
          echo "FPP ${{ matrix.ref }} is at $actual"
          # The tag is a moving name; the commit is the pin. A tag that was
          # repointed must fail here rather than silently change what this
          # build proves.
          test "$actual" = "${{ matrix.commit }}"

      - name: Compile the adapter against the pinned headers
        run: make -C native/adapters ${{ matrix.major }} FPP_SRC=/tmp/fpp/src

      - name: Verify the loader-visible symbols
        run: make -C native/adapters verify-${{ matrix.major }} FPP_SRC=/tmp/fpp/src

  release-artifacts:
    # FPP hosts carry no Go toolchain, so this binary ships as a prebuilt,
    # sha256-verified static binary. This job is that pipeline: three
    # CGO_ENABLED=0 cross-compiles covering the fleet's real targets
    # (amd64, a Raspberry Pi on arm64, and a BeagleBone needing
    # GOARCH=arm GOARM=7), the pinned SHA256SUMS manifest, and its
    # verification, on every run rather than as a one-time trusted claim.
    #
    # This job deliberately creates no release, uploads no artifact, and
    # pushes nothing. Candidate artifacts stay private until the first
    # real-host install gate passes and the owner approves publication.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # A clearly-non-release version: the pinned tag format is
      # fpp-plugin-v<VERSION> and this is not that. It exists only so the
      # artifact filenames and manifest are exercised end to end.
      - name: Build and self-verify the release artifacts
        run: make release VERSION=0.0.0-ci.${{ github.sha }}

      - name: Verify the release build is reproducible
        run: make verify-reproducible VERSION=0.0.0-ci.${{ github.sha }}

      # The native component ships as source compiled on the host, so what
      # matters is that the bundle builds on its own: extracted into an
      # empty directory, with nothing else from this repository present.
      # SHOWMESH_REQUIRE_LOCALE_TEST is deliberately not set here: this step
      # stands in for an FPP host running the bundle's tests as a
      # post-compile validation, and such a host carries only C and POSIX.
      - name: Build the native bundle standalone
        run: |
          set -eux
          sudo apt-get update -o Acquire::Retries=2
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libjsoncpp-dev
          mkdir -p /tmp/bundle
          tar -xzf dist/showmesh-fpp-plugin-native_0.0.0-ci.${{ github.sha }}.tar.gz -C /tmp/bundle
          make -C /tmp/bundle/native test

      - name: Confirm every artifact is a static Linux binary for its named architecture
        run: |
          set -eux
          cd dist
          check_arch() {
            rm -rf check && mkdir check
            tar -xzf "showmesh-fpp-plugin_0.0.0-ci.${{ github.sha }}_linux_$1.tar.gz" -C check
            described=$(file check/showmesh-fpp-plugin)
            echo "$described"
            echo "$described" | grep -q 'statically linked'
            echo "$described" | grep -q "$2"
          }
          check_arch amd64 'x86-64'
          check_arch arm64 'ARM aarch64'
          check_arch armv7 'ARM, EABI5'
